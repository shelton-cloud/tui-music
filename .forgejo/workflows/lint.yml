name: Pylint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-bookworm
    steps:
      - name: Clone repository
        run: |
          which git || (apt-get update -qq && apt-get install -y -qq git)
          git clone http://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_TOKEN }}@forgejo.lan/shelton/tui-music.git .
          git checkout ${{ github.sha }}

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq libmpv-dev mpv

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt

      - name: Analysing the code with pylint
        run: |
          pylint $(git ls-files '*.py') --rcfile=.pylintrc
